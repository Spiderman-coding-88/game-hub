<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Snake</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#080d12;color:#f4f7f2;font-family:Arial,sans-serif}.wrap{text-align:center;padding:20px}h1{color:#c8ff3d;letter-spacing:5px;margin:0 0 8px}p{color:#a4b0bf}canvas{width:min(80vw,440px);height:min(80vw,440px);border:1px solid #38472c;background:#0d1514;image-rendering:pixelated}.row{display:flex;justify-content:center;gap:20px;font-weight:bold;margin:12px}button{background:#c8ff3d;color:#10150a;border:0;padding:11px 18px;font-weight:bold;cursor:pointer}
</style></head><body><main class="wrap"><h1>SNAKE</h1><p>Arrow keys or WASD to move</p><div class="row"><span>SCORE: <b id="score">0</b></span><span>BEST: <b id="best">0</b></span></div><canvas id="board" width="440" height="440"></canvas><p id="message">Press an arrow key to start</p><button id="restart">RESTART</button></main>
<script>
const canvas=document.getElementById('board'),ctx=canvas.getContext('2d'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),msg=document.getElementById('message');
const cells=22,size=20;let snake,food,dir,nextDir,score,timer,started,dead;
bestEl.textContent=localStorage.getItem('snake-best')||'0';
function reset(){clearInterval(timer);snake=[{x:10,y:11},{x:9,y:11},{x:8,y:11}];food={x:15,y:10};dir={x:1,y:0};nextDir=dir;score=0;started=false;dead=false;scoreEl.textContent=0;msg.textContent='Press an arrow key to start';draw()}
function draw(){ctx.fillStyle='#0d1514';ctx.fillRect(0,0,440,440);ctx.strokeStyle='#17231e';for(let i=0;i<=cells;i++){ctx.beginPath();ctx.moveTo(i*size,0);ctx.lineTo(i*size,440);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*size);ctx.lineTo(440,i*size);ctx.stroke()}ctx.fillStyle='#ff8a5b';ctx.fillRect(food.x*size+3,food.y*size+3,size-6,size-6);snake.forEach((p,i)=>{ctx.fillStyle=i?'#7fa52b':'#c8ff3d';ctx.fillRect(p.x*size+2,p.y*size+2,size-4,size-4)})}
function tick(){dir=nextDir;const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(head.x<0||head.y<0||head.x>=cells||head.y>=cells||snake.some((p,i)=>i<snake.length-1&&p.x===head.x&&p.y===head.y)){dead=true;clearInterval(timer);msg.textContent='Game over — press RESTART';return}snake.unshift(head);if(head.x===food.x&&head.y===food.y){score+=10;scoreEl.textContent=score;const best=Math.max(score,Number(localStorage.getItem('snake-best')||0));localStorage.setItem('snake-best',best);bestEl.textContent=best;do{food={x:Math.floor(Math.random()*cells),y:Math.floor(Math.random()*cells)}}while(snake.some(p=>p.x===food.x&&p.y===food.y))}else snake.pop();draw()}
document.addEventListener('keydown',e=>{const map={ArrowUp:{x:0,y:-1},w:{x:0,y:-1},ArrowDown:{x:0,y:1},s:{x:0,y:1},ArrowLeft:{x:-1,y:0},a:{x:-1,y:0},ArrowRight:{x:1,y:0},d:{x:1,y:0}};const d=map[e.key];if(!d)return;e.preventDefault();if(d.x!==-dir.x||d.y!==-dir.y)nextDir=d;if(!started&&!dead){started=true;msg.textContent='Collect the orange food';timer=setInterval(tick,105)}});
document.getElementById('restart').onclick=reset;reset();
</script></body></html>
