<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Snake</title>
<style>
:root{--bg:#f2f5ec;--fg:#18200f;--muted:#5b6670;--accent:#4f7a00;--accent-fg:#fff;--board:#e4ebd6;--grid:#d3ddc0;--border:#9fb27a;--food:#e0562a;--head:#4f7a00;--body:#7fa52b;--pad:#dfe8cc;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#080d12;--fg:#f4f7f2;--muted:#a4b0bf;--accent:#c8ff3d;--accent-fg:#10150a;--board:#0d1514;--grid:#17231e;--border:#38472c;--food:#ff8a5b;--head:#c8ff3d;--body:#7fa52b;--pad:#16211b}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#080d12;--fg:#f4f7f2;--muted:#a4b0bf;--accent:#c8ff3d;--accent-fg:#10150a;--board:#0d1514;--grid:#17231e;--border:#38472c;--food:#ff8a5b;--head:#c8ff3d;--body:#7fa52b;--pad:#16211b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:Arial,Helvetica,sans-serif;overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.wrap{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:12px;text-align:center}
h1{color:var(--accent);letter-spacing:5px;margin:0;font-size:1.6rem}
p{color:var(--muted);margin:0;font-size:.9rem}
.row{display:flex;gap:20px;font-weight:bold}
canvas{width:min(92vw,calc(100dvh - 360px),480px);min-width:240px;aspect-ratio:1;border:1px solid var(--border);background:var(--board);touch-action:none;display:block}
.pad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,64px);gap:8px;margin-top:4px}
.pad button{background:var(--pad);color:var(--accent);border:1px solid var(--border);border-radius:14px;font-size:1.6rem;touch-action:manipulation}
.pad button:active{background:var(--accent);color:var(--accent-fg)}
.up{grid-column:2;grid-row:1}.left{grid-column:1;grid-row:2}.down{grid-column:2;grid-row:2}.right{grid-column:3;grid-row:2}
#restart{background:var(--accent);color:var(--accent-fg);border:0;border-radius:8px;padding:11px 22px;font-weight:bold;font-size:1rem;cursor:pointer}
@media (hover:hover) and (pointer:fine){.pad{display:none}}
</style></head><body>
<main class="wrap">
<h1>SNAKE</h1>
<div class="row"><span>SCORE: <b id="score">0</b></span><span>BEST: <b id="best">0</b></span></div>
<canvas id="board" width="440" height="440"></canvas>
<p id="message">Swipe, tap the pad, or use arrow keys</p>
<div class="pad" id="pad">
<button class="up" data-d="up" aria-label="Up">▲</button>
<button class="left" data-d="left" aria-label="Left">◀</button>
<button class="down" data-d="down" aria-label="Down">▼</button>
<button class="right" data-d="right" aria-label="Right">▶</button>
</div>
<button id="restart">RESTART</button>
</main>
<script>
const canvas=document.getElementById('board'),ctx=canvas.getContext('2d'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),msg=document.getElementById('message');
const cells=22,size=20;let snake,food,dir,nextDir,score,timer,started,dead,C={};
function getBest(){try{return Number(localStorage.getItem('snake-best'))||0}catch(e){return 0}}
function setBest(v){try{localStorage.setItem('snake-best',v)}catch(e){}}
function colors(){const s=getComputedStyle(document.documentElement);['board','grid','food','head','body'].forEach(k=>C[k]=s.getPropertyValue('--'+k).trim())}
bestEl.textContent=getBest();
function reset(){clearInterval(timer);snake=[{x:10,y:11},{x:9,y:11},{x:8,y:11}];food={x:15,y:10};dir={x:1,y:0};nextDir=dir;score=0;started=false;dead=false;scoreEl.textContent=0;msg.textContent='Swipe, tap the pad, or use arrow keys';colors();draw()}
function draw(){ctx.fillStyle=C.board;ctx.fillRect(0,0,440,440);ctx.strokeStyle=C.grid;for(let i=0;i<=cells;i++){ctx.beginPath();ctx.moveTo(i*size,0);ctx.lineTo(i*size,440);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*size);ctx.lineTo(440,i*size);ctx.stroke()}ctx.fillStyle=C.food;ctx.fillRect(food.x*size+3,food.y*size+3,size-6,size-6);snake.forEach((p,i)=>{ctx.fillStyle=i?C.body:C.head;ctx.fillRect(p.x*size+2,p.y*size+2,size-4,size-4)})}
function tick(){dir=nextDir;const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(head.x<0||head.y<0||head.x>=cells||head.y>=cells||snake.some((p,i)=>i<snake.length-1&&p.x===head.x&&p.y===head.y)){dead=true;clearInterval(timer);msg.textContent='Game over — tap RESTART';if(navigator.vibrate)try{navigator.vibrate(120)}catch(e){}return}snake.unshift(head);if(head.x===food.x&&head.y===food.y){score+=10;scoreEl.textContent=score;const best=Math.max(score,getBest());setBest(best);bestEl.textContent=best;do{food={x:Math.floor(Math.random()*cells),y:Math.floor(Math.random()*cells)}}while(snake.some(p=>p.x===food.x&&p.y===food.y))}else snake.pop();draw()}
const DIRS={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};
function steer(d){if(dead)return;if(d.x!==-dir.x||d.y!==-dir.y)nextDir=d;if(!started){started=true;msg.textContent='Collect the orange food';timer=setInterval(tick,105)}}
const KEYS={ArrowUp:'up',w:'up',ArrowDown:'down',s:'down',ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right'};
document.addEventListener('keydown',e=>{const k=KEYS[e.key];if(!k)return;e.preventDefault();steer(DIRS[k])});
document.querySelectorAll('#pad button').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();steer(DIRS[b.dataset.d])}));
let sx=0,sy=0,tracking=false;
canvas.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;tracking=true;e.preventDefault()},{passive:false});
canvas.addEventListener('touchmove',e=>{e.preventDefault();if(!tracking)return;const t=e.touches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;steer(Math.abs(dx)>Math.abs(dy)?(dx>0?DIRS.right:DIRS.left):(dy>0?DIRS.down:DIRS.up));sx=t.clientX;sy=t.clientY},{passive:false});
canvas.addEventListener('touchend',()=>{tracking=false});
document.getElementById('restart').onclick=reset;
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>{colors();draw()});
reset();
</script></body></html>
