<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Number Puzzle</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0c1019;color:#f2f3ff;font-family:Arial,sans-serif;padding:20px}.wrap{width:min(92vw,450px);text-align:center}h1{color:#9d9bff;letter-spacing:4px;margin:0 0 7px}p{color:#a1a9ba}.board{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:22px 0}.tile{aspect-ratio:1;background:#191d30;border:1px solid #353855;color:#c5c3ff;font-size:clamp(20px,6vw,32px);font-weight:bold;cursor:pointer}.tile.blank{background:#0c1019;border-color:#25283b;cursor:default}.tile:not(.blank):hover{border-color:#9d9bff}.controls{display:flex;justify-content:center;gap:10px}button.action{background:#9d9bff;color:#0c0b1c;border:0;padding:11px 15px;font-weight:bold;cursor:pointer}
</style></head><body><main class="wrap"><h1>NUMBER PUZZLE</h1><p>Arrange the numbers from 1 to 15. Tap a tile next to the empty space.</p><p>MOVES: <b id="moves">0</b></p><div id="board" class="board"></div><p id="status">Put the numbers in order.</p><div class="controls"><button class="action" id="shuffle">SHUFFLE</button><button class="action" id="reset">RESET</button></div></main>
<script>
const board=document.getElementById('board'),movesEl=document.getElementById('moves'),status=document.getElementById('status');let tiles=[],moves=0;function solved(){return tiles.every((v,i)=>v===(i===15?0:i+1))}function render(){board.innerHTML='';tiles.forEach((n,i)=>{const b=document.createElement('button');b.className='tile'+(n===0?' blank':'');b.textContent=n||'';b.disabled=n===0;b.onclick=()=>move(i);board.appendChild(b)});movesEl.textContent=moves;if(solved())status.textContent='Solved! Great job.'}
function move(i){const blank=tiles.indexOf(0),distance=Math.abs(Math.floor(i/4)-Math.floor(blank/4))+Math.abs(i%4-blank%4);if(distance!==1)return;[tiles[i],tiles[blank]]=[tiles[blank],tiles[i]];moves++;status.textContent='Keep going!';render()}
function shuffle(){tiles=Array.from({length:16},(_,i)=>(i+1)%16);let prev=-1;for(let k=0;k<180;k++){const blank=tiles.indexOf(0),opts=[blank-4,blank+4,blank%4?blank-1:-1,blank%4<3?blank+1:-1].filter(i=>i>=0&&i<16&&Math.abs(Math.floor(i/4)-Math.floor(blank/4))+Math.abs(i%4-blank%4)===1&&i!==prev);const choice=opts[Math.floor(Math.random()*opts.length)];prev=blank;[tiles[blank],tiles[choice]]=[tiles[choice],tiles[blank]]}moves=0;status.textContent='Put the numbers in order.';render()}
function reset(){tiles=Array.from({length:16},(_,i)=>(i+1)%16);moves=0;status.textContent='Put the numbers in order.';render()}
document.getElementById('shuffle').onclick=shuffle;document.getElementById('reset').onclick=reset;shuffle();
</script></body></html>
