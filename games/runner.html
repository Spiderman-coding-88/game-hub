<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Neon Runner</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#090b14;color:#fff;font-family:Arial,sans-serif;padding:18px}.wrap{text-align:center;width:min(94vw,800px)}h1{color:#ff8a5b;letter-spacing:4px;margin:0 0 6px}p{color:#a8afc2}canvas{display:block;width:100%;border:1px solid #3a2a38;background:linear-gradient(#141226,#080b14)}button{margin-top:15px;background:#ff8a5b;color:#1b0c08;border:0;padding:12px 18px;font-weight:bold;cursor:pointer}
</style></head><body><main class="wrap"><h1>NEON RUNNER</h1><p>Press SPACE or click the game to jump over obstacles.</p><canvas id="game" width="800" height="360"></canvas><p id="status">Press SPACE to start / jump. Avoid the blocks!</p><button id="restart">RESTART RUN</button></main>
<script>
const c=document.getElementById('game'),ctx=c.getContext('2d'),status=document.getElementById('status');let player,obstacles,speed,score,running,over,lastSpawn,raf;
function reset(){cancelAnimationFrame(raf);player={x:90,y:275,vy:0};obstacles=[];speed=5;score=0;running=false;over=false;lastSpawn=0;status.textContent='Press SPACE or click to start.';draw()}
function jump(){if(over){reset();running=true;player.vy=-13;return}if(!running){running=true;status.textContent='Keep going!';}if(player.y>=274)player.vy=-13}
function draw(){ctx.clearRect(0,0,800,360);ctx.strokeStyle='#24243b';for(let x=0;x<800;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,360);ctx.stroke()}ctx.strokeStyle='#ff8a5b';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,300);ctx.lineTo(800,300);ctx.stroke();ctx.fillStyle='#ff8a5b';ctx.fillRect(player.x,player.y,27,27);ctx.fillStyle='#fff';ctx.fillRect(player.x+16,player.y+7,5,5);ctx.fillStyle='#c8ff3d';obstacles.forEach(o=>ctx.fillRect(o.x,o.y,o.w,o.h));ctx.fillStyle='#f5f7ff';ctx.font='bold 18px monospace';ctx.fillText('SCORE '+Math.floor(score),20,30);if(!running){ctx.fillStyle='#ffffffaa';ctx.font='bold 25px Arial';ctx.fillText(over?'RUN OVER':'READY?',340,160)}}
function loop(t){if(!running){draw();return}if(!lastSpawn)lastSpawn=t;if(t-lastSpawn>1050+Math.random()*650){obstacles.push({x:810,y:300-(25+Math.random()*40),w:20+Math.random()*18,h:25+Math.random()*40});lastSpawn=t}player.vy+=.65;player.y=Math.min(275,player.y+player.vy);if(player.y>=275)player.vy=0;obstacles.forEach(o=>o.x-=speed);obstacles=obstacles.filter(o=>o.x+o.w>0);score+=.12;speed=Math.min(10,5+score/90);for(const o of obstacles){if(player.x+24>o.x&&player.x<o.x+o.w&&player.y+24>o.y){running=false;over=true;status.textContent='You scored '+Math.floor(score)+'. Press restart or jump to try again.'}}draw();raf=requestAnimationFrame(loop)}
function startLoop(){cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
document.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();jump();startLoop()}});c.addEventListener('pointerdown',()=>{jump();startLoop()});document.getElementById('restart').onclick=()=>{reset();jump();startLoop()};reset();
</script></body></html>
