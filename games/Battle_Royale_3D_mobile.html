const $=i=>document.getElementById(i),V=THREE.Vector3,R=Math.random,PI=Math.PI,cl=(v,a,b)=>Math.min(b,Math.max(a,v));

const WP=[
{n:'AR-47',mag:30,res:90,dmg:30,rate:105,rec:.012,spr:.016,rt:2000,auto:1,rng:200,snd:[1800,.5,.9],c:0xb45309},

const P={p:new V(),vel:new V(),vy:0,yaw:0,pitch:0,rec:0,hp:100,ar:0,w:0,mag:[],res:[],last:0,kills:0,rl:0,rlS:0,cr:0,eye:1.7,gr:1,ads:0,bob:0,kick:0,sw:0,t0:0};

/* ---------- audio (synthesised, stereo-panned) ---------- */
let AC,NB;
function aud(){if(AC)return;AC=new(window.AudioContext||window.webkitAudioContext)();NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=R()*2-1}
function snd(f,dur,gain,pan=0,type='lp',tone=0){if(!AC)return;const T=AC.currentTime,s=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain();s.buffer=NB;fl.type=type=='lp'?'lowpass':'bandpass';fl.frequency.value=f;g.gain.setValueAtTime(gain,T);g.gain.exponentialRampToValueAtTime(.001,T+dur);s.connect(fl);fl.connect(g);
 if(AC.createStereoPanner){const p=AC.createStereoPanner();p.pan.value=pan;g.connect(p);p.connect(AC.destination)}else g.connect(AC.destination);s.start(0,R()*.5);s.stop(T+dur);

const shotSnd=(i,v,p)=>{const s=WP[i].snd;snd(s[0],s[2]*.3,s[1]*v,p,'lp',150)};
const panOf=(x,z)=>{const rx=x-P.p.x,rz=z-P.p.z,l=Math.hypot(rx,rz)||1;return cl((rx*Math.cos(P.yaw)-rz*Math.sin(P.yaw))/l,-1,1)};

/* ---------- world ---------- */
function box(x,y,z,w,h,d,m,col=1){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y+h/2,z);o.castShadow=o.receiveShadow=true;scene.add(o);solids.push(o);if(col)cols.push({x,z,hw:w/2,hd:d/2});return o}
function building(s){const{x,z,w,d,y}=s,t=.5,h=4.2,m=MT(0x94a3b8),b=y-3,sw=(w-3)/2;
 box(x,b,z-d/2,w,h+3,t,m);box(x-w/2,b,z,t,h+3,d,m);box(x+w/2,b,z,t,h+3,d,m);

 box(x,y+h,z,w+.8,.4,d+.8,MT(0x475569),0);const f=box(x,y,z,w,.1,d,MT(0x57534e),0);f.castShadow=false;bld.push(s)}
function world(){
 for(let n=0;n<300&&sites.length<7;n++){const x=(R()-.5)*230,z=(R()-.5)*230;if(Math.hypot(x,z)>25&&sites.every(s=>Math.hypot(s.x-x,s.z-z)>55))sites.push({x,z,y:H0(x,z),r0:12,r1:24,w:11+(R()*5|0),d:11+(R()*5|0)})}

 for(let i=0;i<ps.count;i++){const x=ps.getX(i),z=ps.getZ(i),h=H(x,z),t=cl((h+8)/16,0,1),n=Math.sin(x*.7)*Math.cos(z*.6)*.04;ps.setY(i,h);cs.set([.17+.16*t+n,.33+.14*t+n,.1+.05*t],i*3)}
 g.setAttribute('color',new THREE.BufferAttribute(cs,3));g.computeVertexNormals();
 terr=new THREE.Mesh(g,new THREE.MeshStandardMaterial({vertexColors:true,roughness:1}));terr.receiveShadow=true;scene.add(terr);solids.push(terr);
 const far=new THREE.Mesh(new THREE.PlaneGeometry(1500,1500),MT(0x2f4a20));far.rotation.x=-PI/2;far.position.y=-10;scene.add(far);
 [[0,-HW-2,W+8,4],[0,HW+2,W+8,4],[-HW-2,0,4,W+8],[HW+2,0,4,W+8]].forEach(([x,z,w,d])=>box(x,-12,z,w,45,d,MT(0x57534e)));

 for(let i=0;i<30;i++){const x=(R()-.5)*280,z=(R()-.5)*280,s=1.4+R()*.8;if(sites.some(q=>Math.hypot(q.x-x,q.z-z)<q.r1))continue;box(x,H(x,z)-.6,z,s,s+.6,s,cm)}
 for(let i=0;i<25;i++){const x=(R()-.5)*280,z=(R()-.5)*280,s=1.2+R()*1.1;if(sites.some(q=>Math.hypot(q.x-x,q.z-z)<q.r1))continue;const o=new THREE.Mesh(new THREE.DodecahedronGeometry(s),MT(0x78716c));o.position.set(x,H(x,z)+s*.3,z);o.rotation.set(R()*3,R()*3,0);o.castShadow=o.receiveShadow=true;scene.add(o);solids.push(o);cols.push({x,z,r:s*.8})}
 const N=80,tr=new THREE.InstancedMesh(new THREE.CylinderGeometry(.25,.4,4,6),MT(0x5b3a1e),N),c1=new THREE.InstancedMesh(new THREE.ConeGeometry(2.4,4.5,7),MT(0x1f6b34),N),c2=new THREE.InstancedMesh(new THREE.ConeGeometry(1.8,3.5,7),MT(0x2c8a43),N),dm=new THREE.Object3D();
 for(let i=0;i<N;){const x=(R()-.5)*290,z=(R()-.5)*290;if(sites.some(q=>Math.hypot(q.x-x,q.z-z)<q.r1))continue;const y=H(x,z),s=.8+R()*.7;dm.scale.setScalar(s);
  dm.position.set(x,y+2*s,z);dm.updateMatrix();tr.setMatrixAt(i,dm.matrix);dm.position.y=y+4.2*s;dm.updateMatrix();c1.setMatrixAt(i,dm.matrix);dm.position.y=y+6.3*s;dm.updateMatrix();c2.setMatrixAt(i,dm.matrix);cols.push({x,z,r:.5*s+.1});i++}
 [tr,c1,c2].forEach(o=>{o.frustumCulled=false;o.castShadow=true;scene.add(o)});solids.push(tr);

/* ---------- zone ---------- */
function nextZone(){Z.ph++;if(Z.ph>=PH.length){Z.fin=1;return}const q=PH[Z.ph],a=R()*PI*2,d=R()*Math.max(0,Z.r-q.r)*.8;Z.tr=q.r;Z.tc=new V(Z.c.x+Math.cos(a)*d,0,Z.c.z+Math.sin(a)*d);Z.t=q.w;Z.shr=0}

function mkLoot(t,x,z){const g=new THREE.Group(),c={med:0x22c55e,arm:0x3b82f6,ammo:0xf59e0b}[t],m=new THREE.Mesh(new THREE.BoxGeometry(.5,.35,.35),new THREE.MeshStandardMaterial({color:c,roughness:.5,emissive:c,emissiveIntensity:.3}));m.castShadow=true;m.position.y=.5;g.add(m);
