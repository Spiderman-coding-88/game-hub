<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Neon Drift</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&display=swap">
<style>
:root{--mg:#ff0000;--cy:#19f2ff;--am:#ffb02e;--tx:#ece8ff;--pn:rgba(14,6,36,.78);--sa:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#05030f;color:var(--tx);font:500 15px 'Chakra Petch',system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
#cam,#cv{position:fixed;inset:0;width:100%;height:100%}
#cam{object-fit:cover;display:none;background:radial-gradient(circle at 50% 35%,#4a4560,#0d0b14)}
body[data-m=ar] #cam{display:block}
#cv{z-index:1}
#fx{position:fixed;inset:0;z-index:2;pointer-events:none;box-shadow:inset 0 0 130px 20px rgba(25,242,255,0);transition:box-shadow .25s}
body.bst #fx{box-shadow:inset 0 0 140px 30px rgba(25,242,255,.5)}
.u{position:fixed;z-index:3;margin-left: 50px;}
button{font:inherit;color:var(--tx);background:var(--pn);border:1px solid #ff2b2b66;border-radius:10px;padding:9px 13px;backdrop-filter:blur(6px);cursor:pointer}
button:hover,button.on{border-color:var(--cy);box-shadow:0 0 14px #19f2ff66}
button:focus-visible{outline:2px solid var(--cy)}
#bar{top:calc(var(--sa) + 10px);left:10px;display:flex;gap:6px;flex-wrap:wrap;max-width:62vw}
#mm{top:calc(var(--sa) + 10px);right:10px;width:170px;height:170px;border-radius:50%;box-shadow:0 0 22px #19f2ff55}
#sp{right:10px;bottom:calc(var(--sb) + 10px);width:230px;height:230px}
#hint{left:12px;bottom:calc(var(--sb) + 12px);opacity:.75;max-width:290px;line-height:1.35}
#toast{top:22%;left:50%;transform:translateX(-50%);padding:9px 18px;border-radius:22px;background:var(--pn);border:1px solid var(--am);opacity:0;transition:opacity .3s;pointer-events:none;text-align:center;max-width:86vw}
#toast.s{opacity:1}
.tc{display:none;bottom:calc(var(--sb) + 12px);gap:8px}
#tl{left:10px;grid-template-columns:repeat(2,58px)}
#tr{right:10px;grid-template-columns:repeat(2,58px)}
.tc button{width:58px;height:58px;padding:0;border-radius:50%;font-size:12px}
@media(pointer:coarse),(max-width:700px){.tc{display:grid}#hint{display:none}#sp{width:122px;height:122px;left:50%;right:auto;transform:translateX(-50%)}#mm{width:112px;height:112px}}
#start,#garage,#ar{display:none}
body[data-m=start] :is(#mm,#sp,.tc,#hint),body[data-m=garage] :is(#mm,#sp,.tc,#hint),body[data-m=ar] #mm{display:none!important}
body[data-m=start] #start{display:flex}
body[data-m=garage] #garage{display:flex}
body[data-m=ar] #ar{display:flex}
#start{inset:0;z-index:5;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;background:radial-gradient(ellipse at center,rgba(5,3,15,.25),rgba(5,3,15,.88))}
#start h1{margin:0;font-size:clamp(52px,12vw,120px);line-height:.95;color:var(--mg);text-shadow:0 0 12px var(--mg),0 0 42px #ff2b2b99,3px 3px 0 var(--cy)}
#start p{max-width:46ch;margin:0;font-size:17px;line-height:1.45}
#start button{font-size:18px;padding:12px 24px;margin:0 5px}
#garage,#ar{flex-direction:column;gap:10px;background:var(--pn);border:1px solid #ff2b2b66;border-radius:14px;padding:14px;backdrop-filter:blur(8px)}
#garage{right:12px;top:calc(var(--sa) + 12px);width:250px}
#garage h2{margin:0;font-size:22px;color:var(--cy)}
.rw{display:flex;gap:6px;flex-wrap:wrap}
.sq{width:34px;height:34px;padding:0;border-radius:8px}
.sq.on{border:2px solid #fff;box-shadow:0 0 14px #fff8}
#ar{left:10px;top:calc(var(--sa) + 62px);width:min(290px,64vw)}
#ar div{display:flex;gap:6px}
label{display:flex;justify-content:space-between;align-items:center;gap:8px}
input[type=range]{flex:1;accent-color:var(--mg)}
@media(max-width:700px){#garage{top:auto;left:8px;right:8px;width:auto;bottom:calc(var(--sb) + 8px)}}
</style></head><body data-m="start">
<video id="cam" playsinline muted></video><canvas id="cv"></canvas><div id="fx"></div>
<div id="bar" class="u"><button data-a="drive">Drive</button><button data-a="garage">Garage</button><button data-a="wx">Weather</button><button data-a="snd">Sound on</button></div>
<canvas id="mm" class="u" width="300" height="300"></canvas><canvas id="sp" class="u" width="440" height="440"></canvas>
<!-- <div id="hint" class="u">Drive with WASD or arrows. Space drifts, Shift fires nitro, G opens the garage, R resets.</div> -->
<div id="toast" class="u"></div>
<div id="tl" class="u tc"><button data-k="l">Left</button><button data-k="r">Right</button></div>
<div id="tr" class="u tc"><button data-k="g">Gas</button><button data-k="b">Brake</button><button data-k="n">Nitro</button><button data-k="d">Drift</button></div>
<div id="garage" class="u"></div>
<div id="ar" class="u"><span>Aim at a flat surface and tap to place the car.</span><label>Size <input id="as" type="range" min=".02" max=".2" step=".005" value=".06"></label><label>Turn <input id="at" type="range" min="0" max="6.28" step=".05" value="0"></label><div><button id="ap">Move car</button><button id="ax">Exit AR</button></div></div>
<div id="start" class="u"><h1>Neon Drift</h1><p>Slide through a rain-slick neon grid. Long drifts fill your nitro, amber pads fire a burst, and AR mode puts your RC car on a real table.</p><div><button id="s1">Start driving</button><button id="s2">Open garage</button></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=s=>document.querySelector(s),T=THREE,R=Math.random,PI=Math.PI,D=PI/180,cl=(v,a,b)=>v<a?a:v>b?b:v,lp=(a,b,t)=>a+(b-a)*t;
const H=(x,z,s)=>{const n=Math.sin(x*12.9898+z*78.233+s*37.7)*43758.5453;return n-Math.floor(n)};
let cfg={body:'#ff2bd6',neon:'#19f2ff',style:0,sp:1,wh:1};
try{Object.assign(cfg,JSON.parse(localStorage.getItem('nd')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('nd',JSON.stringify(cfg))}catch(e){}};
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('s');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('s'),3400)};

/* ---------- renderer & scene ---------- */
const cv=$('#cv'),rd=new T.WebGLRenderer({canvas:cv,antialias:true,alpha:true});
rd.setPixelRatio(Math.min(devicePixelRatio,2));rd.shadowMap.enabled=true;rd.shadowMap.type=T.PCFSoftShadowMap;rd.toneMapping=T.ACESFilmicToneMapping;rd.toneMappingExposure=1.25;rd.setClearColor(0,0);
const sc=new T.Scene(),cam=new T.PerspectiveCamera(66,1,.05,600),world=new T.Group(),bg=new T.Color(0x0b0420),fog=new T.FogExp2(0x1a0638,.011);
sc.background=bg;sc.fog=fog;sc.add(world);
const hemi=new T.HemisphereLight(0x7a5cff,0x1a0030,.8);sc.add(hemi);
const sun=new T.DirectionalLight(0xcfa8ff,1.1);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.bias=-.0004;world.add(sun,sun.target);
const shad=k=>{const c=sun.shadow.camera,s=70*k;c.left=-s;c.right=s;c.top=s;c.bottom=-s;c.near=k;c.far=220*k;c.updateProjectionMatrix()};shad(1);
const mk=(w,h,fn)=>{const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'),w,h);const t=new T.CanvasTexture(c);t.wrapS=t.wrapT=T.RepeatWrapping;t.anisotropy=8;return t};

/* ---------- glowing grid roads ---------- */
const gnd=glow=>mk(512,512,(g,w,h)=>{
 g.fillStyle=glow?'#000':'#1a1032';g.fillRect(0,0,w,h);g.shadowBlur=glow?16:0;
 const a=7/40*w,b=33/40*w;
 g.strokeStyle='#19f2ff';g.shadowColor='#19f2ff';g.lineWidth=6;g.strokeRect(a,a,b-a,b-a);
 g.strokeStyle='#ff2bd6';g.shadowColor='#ff2bd6';g.lineWidth=5;g.setLineDash([30,26]);
 for(const v of[0,w]){g.beginPath();g.moveTo(v,0);g.lineTo(v,h);g.moveTo(0,v);g.lineTo(w,v);g.stroke()}
 g.setLineDash([]);g.shadowBlur=0;g.strokeStyle='#6a35e0';g.lineWidth=2;
 for(const v of[45,w-45]){g.beginPath();g.moveTo(v,0);g.lineTo(v,h);g.moveTo(0,v);g.lineTo(w,v);g.stroke()}});
const gm=new T.MeshStandardMaterial({map:gnd(0),emissiveMap:gnd(1),emissive:0xffffff,roughness:.45,metalness:.5}),shm=new T.ShadowMaterial({opacity:.55});
gm.map.repeat.set(12,12);gm.emissiveMap.repeat.set(12,12);
const ground=new T.Mesh(new T.PlaneGeometry(480,480),gm);ground.rotation.x=-PI/2;ground.receiveShadow=true;world.add(ground);
const arena=new T.Mesh(new T.RingGeometry(31.5,32,64).rotateX(-PI/2),new T.MeshBasicMaterial({color:0x19f2ff,transparent:true,opacity:.7}));arena.position.y=.03;arena.visible=false;world.add(arena);

/* ---------- city blocks & speed pads (instanced) ---------- */
const N=121,cityG=new T.Group();world.add(cityG);
const wt=mk(32,128,(g,w,h)=>{g.fillStyle='#07040f';g.fillRect(0,0,w,h);for(let x=2;x<w;x+=6)for(let y=0;y<h;y+=3)if(R()<.45){g.fillStyle=['#19f2ff','#ff2bd6','#ffb02e','#9b7bff','#e8f6ff'][R()*5|0];g.globalAlpha=.4+R()*.6;g.fillRect(x,y,3,2)}g.globalAlpha=1});
const bm=new T.InstancedMesh(new T.BoxGeometry(1,1,1).translate(0,.5,0),new T.MeshBasicMaterial({map:wt}),N);bm.castShadow=true;bm.frustumCulled=false;
const pt=mk(64,96,(g,w,h)=>{g.fillStyle='rgba(255,176,46,.14)';g.fillRect(0,0,w,h);g.strokeStyle='#ffb02e';g.shadowColor='#ffb02e';g.shadowBlur=10;g.lineWidth=6;for(let i=0;i<3;i++){const y=20+i*26;g.beginPath();g.moveTo(10,y+16);g.lineTo(32,y);g.lineTo(54,y+16);g.stroke()}g.strokeRect(2,2,w-4,h-4)});
const pm=new T.InstancedMesh(new T.PlaneGeometry(6,9).rotateX(-PI/2),new T.MeshBasicMaterial({map:pt,transparent:true,blending:T.AdditiveBlending,depthWrite:false}),N);pm.frustumCulled=false;
cityG.add(bm,pm);
let cc=[1e9,1e9],pads=[];const dm=new T.Object3D(),tn=[[1,2,1],[1,.6,.95],[.6,.95,1],[1,.85,.6]].map(a=>new T.Color(...a));
function city(ci,cj){cc=[ci,cj];pads=[];let n=0;
 for(let i=-5;i<=5;i++)for(let j=-5;j<=5;j++){const a=ci+i,b=cj+j,x=a*40+20,z=b*40+20,h=H(a,b,1),w=20+H(a,b,2)*6;
  dm.position.set(x,0,z);dm.rotation.set(0,0,0);dm.scale.set(w,18+h*h*h*95,w);dm.updateMatrix();bm.setMatrixAt(n,dm.matrix);bm.setColorAt(n,tn[H(a,b,3)*4|0]);n++;
  const q=H(a,b,4);if(q>.4){const v=q>.7,o=(H(a,b,5)-.5)*20;pads.push({x:v?x-20:x+o,z:v?z+o:z-20,v})}}
 for(let k=0;k<N;k++){const p=pads[k];if(p){dm.position.set(p.x,.07,p.z);dm.rotation.y=p.v?0:PI/2;dm.scale.set(1,1,1)}else dm.scale.set(0,0,0);dm.updateMatrix();pm.setMatrixAt(k,dm.matrix)}
 bm.instanceMatrix.needsUpdate=bm.instanceColor.needsUpdate=pm.instanceMatrix.needsUpdate=true}

/* ---------- RC vehicle ---------- */
const car=new T.Group(),bodyG=new T.Group();car.add(bodyG);world.add(car);
const ug=new T.PointLight(0x19f2ff,2.2,10);ug.position.y=.6;const sl=new T.SpotLight(0xd8e8ff,2.5,60,.5,.6);sl.position.set(0,1,2);sl.target.position.set(0,0,22);car.add(ug,sl,sl.target);
const gT=mk(128,128,g=>{const r=g.createRadialGradient(64,64,4,64,64,64);r.addColorStop(0,'rgba(255,255,255,.9)');r.addColorStop(.5,'rgba(255,255,255,.25)');r.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=r;g.fillRect(0,0,128,128)});
const STY=[[.45,.45,4.2,.42],[.7,.7,4,.62],[.38,.34,4.7,.38]];let FW=[],AW=[],FL=[],WR=.42;
function build(){
 bodyG.clear();FW=[];AW=[];const[bh,ch,L,w0]=STY[cfg.style],wr=WR=w0*cfg.wh,col=new T.Color(cfg.body),neon=new T.Color(cfg.neon);
 const M=(g,m,x,y,z)=>{const o=new T.Mesh(g,m);o.position.set(x,y,z);o.castShadow=true;bodyG.add(o);return o};
 const bd=new T.MeshStandardMaterial({color:col,metalness:.7,roughness:.25,emissive:col,emissiveIntensity:.18}),gl=new T.MeshStandardMaterial({color:0x0a0a22,metalness:1,roughness:.08}),nm=new T.MeshBasicMaterial({color:neon});
 M(new T.BoxGeometry(2,bh,L),bd,0,wr+bh/2-.1,0);M(new T.BoxGeometry(1.6,ch,L*.4),gl,0,wr+bh+ch/2-.1,-L*.08);
 const wm=new T.MeshStandardMaterial({color:0x111118,roughness:.6});
 for(const[sx,sz]of[[-1,1],[1,1],[-1,-1],[1,-1]]){const g=new T.Group(),w=new T.Mesh(new T.CylinderGeometry(wr,wr,.5,20).rotateZ(PI/2),wm);g.position.set(sx*1.12,wr,sz*L*.31);w.castShadow=true;w.add(new T.Mesh(new T.CylinderGeometry(wr*.6,wr*.6,.52,12).rotateZ(PI/2),nm));g.add(w);bodyG.add(g);AW.push(w);if(sz>0)FW.push(g)}
 const hl=new T.MeshBasicMaterial({color:0xfff6d0}),tl=new T.MeshBasicMaterial({color:0xff2040});
 for(const s of[-.7,.7]){M(new T.BoxGeometry(.5,.18,.1),hl,s,wr+bh*.6,L/2);M(new T.BoxGeometry(.5,.14,.1),tl,s,wr+bh*.6,-L/2)}
 if(cfg.sp){M(new T.BoxGeometry(2.1,.1,.6),bd,0,wr+bh+ch*.9,-L/2+.2);for(const s of[-.8,.8])M(new T.BoxGeometry(.1,.4,.1),bd,s,wr+bh+ch*.7,-L/2+.2)}
 for(const s of[-1,1])M(new T.BoxGeometry(.06,.08,L*.9),nm,s*1.01,wr-.02,0);
 FL=[-.6,.6].map(s=>{const f=new T.Mesh(new T.ConeGeometry(.25,1.6,8).rotateX(-PI/2),new T.MeshBasicMaterial({color:0x66e8ff,transparent:true,opacity:.9,blending:T.AdditiveBlending}));f.position.set(s,wr+bh*.5,-L/2-.8);f.visible=false;bodyG.add(f);return f});
 const gp=new T.Mesh(new T.PlaneGeometry(6,8).rotateX(-PI/2),new T.MeshBasicMaterial({map:gT,color:neon,transparent:true,blending:T.AdditiveBlending,depthWrite:false}));gp.position.y=.05;bodyG.add(gp);ug.color.copy(neon)}
build();

/* ---------- weather ---------- */
const RN=2500,rp=new Float32Array(RN*6),rg=new T.BufferGeometry();
for(let i=0;i<RN;i++){const o=i*6;rp[o]=rp[o+3]=(R()-.5)*90;rp[o+1]=R()*40;rp[o+4]=rp[o+1]-1.4;rp[o+2]=rp[o+5]=(R()-.5)*90}
rg.setAttribute('position',new T.BufferAttribute(rp,3));
const rain=new T.LineSegments(rg,new T.LineBasicMaterial({color:0x9fe3ff,transparent:true,opacity:.45}));rain.frustumCulled=false;world.add(rain);
let wx=1,fl=0;const WN=['Clear night','Rain','Thunderstorm'];
function wxApply(){fog.density=[.011,.017,.024][wx];gm.roughness=[.45,.18,.1][wx];rain.visible=wx>0;rg.setDrawRange(0,(wx==1?900:RN)*2)}wxApply();

/* ---------- audio synth ---------- */
let A,mst,eng,engF,engG,nsF,nsG,rnG,nb,muted=false,step=0;
function audioInit(){if(A)return;A=new(window.AudioContext||window.webkitAudioContext)();mst=A.createGain();mst.gain.value=muted?0:.5;mst.connect(A.destination);
 eng=A.createOscillator();eng.type='sawtooth';engF=A.createBiquadFilter();engG=A.createGain();engG.gain.value=0;eng.connect(engF).connect(engG).connect(mst);eng.start();
 nb=A.createBuffer(1,A.sampleRate*2,A.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=R()*2-1;
 const src=(type,f,q)=>{const s=A.createBufferSource(),fl=A.createBiquadFilter(),g=A.createGain();s.buffer=nb;s.loop=true;fl.type=type;fl.frequency.value=f;fl.Q.value=q;g.gain.value=0;s.connect(fl).connect(g).connect(mst);s.start();return[fl,g]};
 [nsF,nsG]=src('bandpass',2000,2);[,rnG]=src('highpass',3500,.5)}
function tone(f,d,ty,v){if(!A)return;const o=A.createOscillator(),g=A.createGain(),t=A.currentTime;o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(mst);o.start();o.stop(t+d)}
function nz(f,d,v){if(!A)return;const s=A.createBufferSource(),g=A.createGain(),fl=A.createBiquadFilter(),t=A.currentTime;s.buffer=nb;fl.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(fl).connect(g).connect(mst);s.start();s.stop(t+d)}
setInterval(()=>{if(!A||muted)return;tone([55,55,82.4,55,73.4,73.4,98,73.4][step%8],.16,'sawtooth',.05);tone([220,261.6,329.6,392][step%4]*(step%16<8?1:1.5),.1,'square',.012);step++},170);

/* ---------- input ---------- */
const K={},km={ArrowUp:'g',w:'g',ArrowDown:'b',s:'b',ArrowLeft:'l',a:'l',ArrowRight:'r',d:'r',' ':'d',Shift:'n'},kk=e=>km[e.key.length>1?e.key:e.key.toLowerCase()];
addEventListener('keydown',e=>{audioInit();const k=kk(e);if(k){K[k]=1;e.preventDefault()}if(e.repeat)return;if(e.key=='g')setMode(mode=='garage'?'drive':'garage');if(e.key=='r')reset();if(e.key=='m')mute()});
addEventListener('keyup',e=>{const k=kk(e);if(k)K[k]=0});addEventListener('blur',()=>{for(const k in K)K[k]=0});
document.querySelectorAll('[data-k]').forEach(b=>{const k=b.dataset.k;b.onpointerdown=e=>{K[k]=1;audioInit();b.setPointerCapture(e.pointerId)};b.onpointerup=b.onpointercancel=()=>K[k]=0});
addEventListener('contextmenu',e=>e.preventDefault());

/* ---------- arcade drift physics ---------- */
const S={x:0,z:0,h:0,vx:0,vz:0,st:0,nit:100,bst:0,drift:0,sp:0,vf:0,vl:0,nitOn:0,gas:0,a:0,ca:0,shake:0};
function reset(){Object.assign(S,{x:0,z:0,h:0,vx:0,vz:0,st:0,ca:0,bst:0,nit:100,shake:0});snap=1}
function phys(dt){const c=S;let fx,fz,lx,lz,vf,vl;
 const dec=()=>{fx=Math.sin(c.h);fz=Math.cos(c.h);lx=fz;lz=-fx;vf=c.vx*fx+c.vz*fz;vl=c.vx*lx+c.vz*lz},rec=()=>{c.vx=fx*vf+lx*vl;c.vz=fz*vf+lz*vl};
 dec();const nit=K.n&&c.nit>1?1:0,gas=K.g||nit?1:0,br=K.b,hb=K.d,sp=Math.abs(vf);
 c.nit=cl(c.nit+(nit?-30:2+(sp>12?Math.abs(vl)*.5:0))*dt,0,100);c.bst=Math.max(0,c.bst-dt);
 const vm=62*(nit?1.5:1)*(c.bst>0?1.3:1);let a=0;
 if(gas)a=34*(1-Math.pow(cl(vf/vm,0,1),1.8))+(nit?46:0)+(c.bst>0?50:0);
 if(br)a-=vf>1?70:30;
 a-=vf*.18+(Math.abs(vf)>.4?Math.sign(vf)*2.5:0);if(vf<-14&&a<0)a=0;
 vf+=a*dt;if(hb)vf*=1-dt*.25;rec();
 c.st+=((K.r?1:0)-(K.l?1:0)-c.st)*Math.min(1,dt*(K.r||K.l?8:12));
 const ang=c.st*lp(.62,.2,cl(sp/60,0,1));c.h-=vf*Math.tan(ang)/2.8*(hb?1.7:1)*(sp<2?sp/2:1)*dt;
 dec();const sl=Math.abs(vl);vl*=Math.exp(-(hb?1:sl>9?3.5:nit?5:8)*dt);rec();
 c.drift=lp(c.drift,sl>5&&sp>12?1:0,Math.min(1,dt*8));
 for(const p of mode=='ar'?[]:pads)if(c.bst<.8&&Math.abs(c.x-p.x)<(p.v?3.5:4.8)&&Math.abs(c.z-p.z)<(p.v?4.8:3.5)){c.bst=2;c.vx+=fx*14;c.vz+=fz*14;[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.15,'square',.08),i*50));toast('Speed pad')}
