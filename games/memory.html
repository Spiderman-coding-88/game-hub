<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Memory Match</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0b1019;color:#f4f6fb;font-family:Arial,sans-serif;display:grid;place-items:center;padding:20px}.wrap{width:min(92vw,540px);text-align:center}h1{color:#6ce5d1;letter-spacing:4px;margin:0 0 6px}p{color:#9da9bb}.stats{display:flex;justify-content:center;gap:24px;margin:18px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.tile{aspect-ratio:1;border:1px solid #34414e;background:#151e2b;color:#6ce5d1;font-size:clamp(25px,7vw,40px);cursor:pointer;border-radius:5px}.tile.open,.tile.matched{background:#17312f;border-color:#6ce5d1}.tile.matched{opacity:.6}button.reset{margin:20px;background:#6ce5d1;color:#071411;border:0;padding:12px 18px;font-weight:bold;cursor:pointer}
</style></head><body><main class="wrap"><h1>MEMORY MATCH</h1><p>Find all matching pairs.</p><div class="stats"><span>MOVES: <b id="moves">0</b></span><span>PAIRS: <b id="pairs">0 / 8</b></span></div><div id="grid" class="grid"></div><p id="status">Tap a card to reveal it.</p><button class="reset" id="reset">SHUFFLE & RESTART</button></main>
<script>
const symbols=['◆','●','▲','✦','✚','⬟','♥','☀'];let deck=[],opened=[],moves=0,matched=0,lock=false;const grid=document.getElementById('grid'),movesEl=document.getElementById('moves'),pairsEl=document.getElementById('pairs'),status=document.getElementById('status');
function start(){deck=[...symbols,...symbols].sort(()=>Math.random()-.5);opened=[];moves=0;matched=0;lock=false;movesEl.textContent='0';pairsEl.textContent='0 / 8';status.textContent='Tap a card to reveal it.';grid.innerHTML='';deck.forEach((symbol,i)=>{const b=document.createElement('button');b.className='tile';b.textContent='?';b.setAttribute('aria-label','Hidden card');b.onclick=()=>flip(b,i);grid.appendChild(b)})}
function flip(button,index){if(lock||button.classList.contains('open')||button.classList.contains('matched'))return;button.classList.add('open');button.textContent=deck[index];button.setAttribute('aria-label',deck[index]);opened.push({button,index});if(opened.length<2)return;moves++;movesEl.textContent=moves;const [a,b]=opened;if(deck[a.index]===deck[b.index]){a.button.classList.add('matched');b.button.classList.add('matched');opened=[];matched++;pairsEl.textContent=`${matched} / 8`;if(matched===8)status.textContent=`You won in ${moves} moves!`}else{lock=true;setTimeout(()=>{a.button.classList.remove('open');b.button.classList.remove('open');a.button.textContent=b.button.textContent='?';opened=[];lock=false},700)}}
document.getElementById('reset').onclick=start;start();
</script></body></html>
